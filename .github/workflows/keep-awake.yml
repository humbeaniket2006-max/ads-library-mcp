name: keep-awake
# Pings /healthz so Render's free instance (spins down after 15 min idle) stays warm.
# GitHub's scheduler can run a few minutes late, so 7 min leaves margin under the 15 min limit.
on:
  schedule:
    - cron: "*/7 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping health endpoint
        env:
          URL: https://meta-ads-library-mcp.onrender.com/healthz
        run: |
          # A cold start takes about a minute, so allow a long timeout and a few retries.
          curl --fail --silent --show-error --max-time 90 --retry 3 --retry-delay 10 --retry-all-errors "$URL"
