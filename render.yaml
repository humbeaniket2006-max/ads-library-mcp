# Render Blueprint: New > Blueprint > pick this repo. Free tier, no manual setup beyond the sync:false values.
# Reference: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: meta-ads-library-mcp
    runtime: python
    plan: free
    # Paid alternative: replace the line above with `plan: starter` to remove sleep and cold starts.
    # Switch when the team uses this daily, or when the first call after sleep (~1 min) times out in claude.ai.
    # plan: starter
    branch: main
    autoDeployTrigger: commit   # replaces the deprecated `autoDeploy: true`
    healthCheckPath: /healthz
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --no-server-header
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      # --- behaviour (non-secret) ---
      - key: GRAPH_API_VERSION
        value: v26.0
      - key: META_MOCK
        value: "true"            # first deploy works before Meta approves identity; set to false to go live
      - key: MCP_AUTH_MODE
        # path_secret | bearer | oauth | oauth_client | both (= path_secret+bearer) | a comma list.
        # OAuth with a client ID + secret: `path_secret,oauth_client`, then `oauth_client` once switched. Needs no extra
        # values: paste MCP_OAUTH_CLIENT_ID / MCP_OAUTH_CLIENT_SECRET into claude.ai > Advanced settings.
        value: path_secret,oauth_client
      - key: LOG_LEVEL
        value: INFO
      # --- Meta call budgets ---
      - key: META_MAX_CALLS_PER_HOUR
        value: "60"
      - key: META_MAX_CALLS_PER_DAY
        value: "500"
      - key: CLIENT_MAX_CALLS_PER_MINUTE
        value: "10"
      - key: CLIENT_MAX_CALLS_PER_HOUR   # per key label, signed-in user (hashed email) or IP
        value: "30"
      - key: CLIENT_MAX_CALLS_PER_DAY
        value: "200"
      # --- cache (seconds / counts / bytes) ---
      - key: CACHE_TTL_ACTIVE
        value: "900"
      - key: CACHE_TTL_HISTORICAL
        value: "21600"
      - key: CACHE_TTL_ADVERTISER
        value: "86400"
      - key: CACHE_MAX_ENTRIES
        value: "500"
      - key: CACHE_MAX_BYTES
        value: "20000000"
      # --- result shaping ---
      - key: DEFAULT_LIMIT
        value: "10"
      - key: MAX_LIMIT
        value: "50"
      - key: MAX_PAGES_PER_CALL
        value: "1"
      - key: MAX_SUMMARY_PAGES
        value: "2"
      - key: AD_TEXT_MAX_CHARS
        value: "300"
      - key: MAX_RESPONSE_CHARS
        value: "12000"
      # --- secrets generated by Render (see the service's Environment tab) ---
      - key: MCP_PATH_SECRET
        generateValue: true
      - key: CURSOR_SIGNING_KEY
        generateValue: true
      # --- secrets you enter at Blueprint creation ---
      - key: META_ACCESS_TOKEN
        sync: false              # leave blank while META_MOCK=true
      - key: MCP_API_KEYS
        sync: false              # optional; LABEL:KEY,LABEL2:KEY2 (only used with bearer/both modes)
      # --- OAuth client ID + secret (MCP_AUTH_MODE=oauth_client) ---
      # PUBLIC_BASE_URL is not set here: the app uses Render's RENDER_EXTERNAL_URL (override with PUBLIC_BASE_URL).
      - key: OAUTH_SIGNING_KEY       # signs client IDs, codes and tokens. Rotating it signs everyone out.
        generateValue: true
      - key: MCP_OAUTH_CLIENT_ID     # the client ID you paste into claude.ai > Advanced settings (not secret)
        value: claude-meta-ads
      - key: MCP_OAUTH_CLIENT_SECRET
        generateValue: true
      - key: OAUTH_ACCESS_TOKEN_TTL  # seconds
        value: "3600"
      - key: OAUTH_REFRESH_TOKEN_TTL
        value: "2592000"
      - key: OAUTH_CODE_TTL
        value: "60"
      # ALLOWED_HOSTS is not set here: the app adds Render's RENDER_EXTERNAL_HOSTNAME automatically.
